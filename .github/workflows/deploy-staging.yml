name: Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/olivium-dev
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy jeeb-gateway to staging
    runs-on: ubuntu-22.04
    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          chmod +x deploy/staging-deploy.sh
          ./deploy/staging-deploy.sh

      - name: Verify deployment
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          echo "Verifying deployment at ${STAGING_URL}/health/live..."
          for i in {1..10}; do
            if curl -sf "${STAGING_URL}/health/live" > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 — waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1
