name: 'Cloudflare Tunnel SSH Setup'
description: 'Installs cloudflared, configures SSH via Cloudflare tunnel, and validates connectivity. Based on Cremat robust pattern from server-cremati.'

inputs:
  ssh-host:
    description: 'Cloudflare tunnel hostname for SSH (e.g., ssh.jeeb.fds-1.com)'
    required: true
  ssh-user:
    description: 'SSH user name'
    required: true
    default: 'ec2-user'
  ssh-private-key:
    description: 'Base64-encoded SSH private key'
    required: true
  retries:
    description: 'Number of SSH connectivity retries'
    required: false
    default: '3'

runs:
  using: 'composite'
  steps:
    - name: Install cloudflared
      shell: bash
      run: |
        echo "==> Installing cloudflared..."
        # Download and install latest cloudflared
        CLOUDFLARED_VERSION=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name' | sed 's/^v//')
        wget -q "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" -O /tmp/cloudflared.deb
        sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y
        rm -f /tmp/cloudflared.deb
        echo "    Installed cloudflared $(cloudflared --version)"

    - name: Setup SSH configuration
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
      run: |
        echo "==> Setting up SSH configuration..."
        
        # Create SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Decode and install private key
        echo "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        
        # Create SSH config with Cloudflare tunnel ProxyCommand
        cat > ~/.ssh/config <<EOF
Host jeeb-vps
    HostName $SSH_HOST
    User $SSH_USER
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    ProxyCommand cloudflared access ssh --hostname %h
    ServerAliveInterval 60
    ServerAliveCountMax 3
EOF
        chmod 600 ~/.ssh/config
        
        echo "    SSH config created with Cloudflare tunnel: $SSH_HOST"

    - name: Test SSH connectivity (with retries)
      shell: bash
      env:
        RETRIES: ${{ inputs.retries }}
      run: |
        echo "==> Testing SSH connectivity (max $RETRIES retries)..."
        
        for i in $(seq 1 $RETRIES); do
          echo "  Attempt $i/$RETRIES..."
          if ssh jeeb-vps "echo 'SSH connection successful'"; then
            echo "    SSH connection established!"
            exit 0
          fi
          echo "    Failed, waiting 5s before retry..."
          sleep 5
        done
        
        echo "ERROR: Failed to establish SSH connection after $RETRIES attempts"
        exit 1
