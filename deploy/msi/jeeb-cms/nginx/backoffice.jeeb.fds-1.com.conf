# Jeeb back-office CMS on the native MSI host.
#
# The MSI operator LAN reaches this HTTP listener directly. Public exposure,
# if later added, still belongs behind Cloudflare Tunnel and Access.

map $uri $jeeb_cms_cache_control {
    default                                      "no-store";
    ~*/remoteEntry\.js$                          "no-store";
    "~*\.[0-9a-f]{8,}\.(?:css|js)$"              "public, max-age=31536000, immutable";
    ~*\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ "public, max-age=86400";
}

map $http_upgrade $jeeb_cms_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name backoffice.jeeb.fds-1.com;

    root /opt/jeeb-cms/current;
    index index.html;
    server_tokens off;
    # Evidence routes contain opaque HMAC tokens in the path. Do not emit this
    # private CMS server's request paths or queries to access logs.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 25m;

    add_header Cache-Control $jeeb_cms_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /release.json {
        try_files /release.json =404;
    }

    # Served manifest bytes are compared with the active on-disk manifest after
    # every deployment. Keep this same-origin endpoint uncacheable.
    location = /SHA256SUMS {
        try_files /SHA256SUMS =404;
    }

    # Hidden path segments always win regex selection, including files whose
    # final extension would otherwise match the static asset handler.
    location ~ (^|/)\. {
        return 404;
    }

    # Module Federation must fail closed. Returning index.html for a missing
    # remote/chunk produces misleading MIME and runtime errors in the shell.
    location = /mf {
        return 404;
    }

    location /mf/ {
        try_files $uri =404;
    }

    # The browser has one API origin. The trailing slash on proxy_pass strips
    # the public /gateway/ prefix before forwarding to the native MSI gateway.
    location = /gateway {
        return 308 /gateway/;
    }

    # Owner callbacks use the gateway's private host/container ingress only.
    # Never expose these intentionally unauthenticated routes through the
    # Cloudflare/browser listener.
    location ~* ^/gateway/svc-callbacks(?:/|$) {
        return 404;
    }

    location ~* ^/gateway/v1/case-events/?$ {
        return 404;
    }

    location /gateway/ {
        proxy_pass http://127.0.0.1:10090/;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_intercept_errors off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jeeb_cms_connection_upgrade;

        # The back-office never caches authenticated API/evidence responses.
        proxy_hide_header Cache-Control;
    }

    # Missing static resources must be real 404s, not the SPA entrypoint.
    location ~* \.(?:css|js|map|json|avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri =404;
    }

    # Only application routes receive the SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
