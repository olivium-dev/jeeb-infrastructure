# Jeeb main site configuration
# Cloudflare tunnel terminates TLS; traffic arrives at nginx as HTTP on port 80.
# The HTTPS server block is kept for direct/local access with self-signed cert.

server {
    listen 80;
    listen [::]:80;
    server_name jeeb.fds-1.com *.jeeb.fds-1.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Let's Encrypt challenge (for HTTP-01 fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static files
    location /static/ {
        alias /home/ec2-user/server-jeeb-config/static-pages/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Jeeb Gateway (BFF)
    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://jeeb-gateway/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Default location
    location / {
        root /var/www/html;
        try_files $uri $uri/ =404;
        index index.html index.htm;
    }
}

# HTTPS server for local/direct access (self-signed cert)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jeeb.fds-1.com *.jeeb.fds-1.com;

    ssl_certificate /etc/letsencrypt/live/jeeb.fds-1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeeb.fds-1.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/jeeb.fds-1.com/chain.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://jeeb-gateway/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        root /var/www/html;
        try_files $uri $uri/ =404;
        index index.html index.htm;
    }
}
