name: List Jeeb Services
on:
  push:
    branches: [fix/cloudflare-ssh-action-yaml]
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Cloudflare SSH
        uses: ./.github/actions/cloudflare-ssh
        with:
          ssh-host: ${{ secrets.JEEB_SSH_HOST }}
          ssh-user: ${{ secrets.JEEB_DEPLOY_USER || 'ec2-user' }}
          ssh-private-key: ${{ secrets.JEEB_SSH_PRIVATE_KEY }}
      - name: docker service ls
        run: |
          echo "===SERVICES==="
          ssh jeeb-vps "docker service ls --format '{{.Name}}|{{.Replicas}}|{{.Image}}' | sort" || true
          echo "===PORTS==="
          ssh jeeb-vps 'for s in $(docker service ls --format "{{.Name}}"); do p=$(docker service inspect "$s" --format "{{range .Endpoint.Ports}}{{.PublishedPort}}->{{.TargetPort}} {{end}}" 2>/dev/null); echo "$s|$p"; done' || true
