name: Deployment safety contract

"on":
  pull_request:
    paths:
      - '.github/workflows/deployment-safety.yml'
      - '.github/workflows/jeeb-staging-edge-deploy.yml'
      - 'deploy/staging/**'
      - 'deploy/staging-192.168.2.20.md'
      - 'scripts/check-deployment-safety-policy.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deployment-safety.yml'
      - '.github/workflows/jeeb-staging-edge-deploy.yml'
      - 'deploy/staging/**'
      - 'deploy/staging-192.168.2.20.md'
      - 'scripts/check-deployment-safety-policy.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify deployment safety and restoration authority
        run: python3 scripts/check-deployment-safety-policy.py
