name: jeeb-staging-edge-deploy

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeeb-staging-edge
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.120.0'
  WRANGLER_CONFIG: deploy/staging/cloudflare/wrangler.toml
  CLOUDFLARE_ACCOUNT_ID: '58198ae51392a2cc2d391867fb65da7e'
  WORKER_NAME: jeeb-staging-host-router
  ORIGIN_ROLLOUT_HELPER: /usr/local/sbin/jeeb-edge-origin-rollout
  EDGE_RUN_KEY: ${{ github.run_id }}_${{ github.run_attempt }}
  REMOTE_STAGE: .jeeb-edge-deploy/${{ github.run_id }}_${{ github.run_attempt }}

jobs:
  default-branch-gate:
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse non-default-branch dispatch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = branch ]
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || {
            echo '::error::Staging edge deploys are allowed only from the default branch.'
            exit 1
          }

  deploy:
    needs: default-branch-gate
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - name: Check out the exact default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'

      - name: Validate the vendored edge contract
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s deploy/staging/tests -p 'test_*.py' -v
          node --check deploy/staging/cloudflare/jeeb-staging-router.mjs
          node --check deploy/staging/scripts/verify-authorized-wss.mjs
          bash -n deploy/staging/scripts/edge-origin-rollout.sh
          sh -n deploy/staging/letsencrypt/renewal-hooks/deploy/jeeb-nginx
          sudo /usr/sbin/visudo -cf \
            deploy/staging/sudoers/jeeb-staging-edge-deploy
          npx --yes "wrangler@$WRANGLER_VERSION" versions upload --dry-run \
            --config "$WRANGLER_CONFIG" \
            --outdir "$RUNNER_TEMP/jeeb-staging-worker-dry-run"

      - name: Preflight protected access without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SSH_HOST: ${{ secrets.JEEB_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_STAGING_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_STAGING_SSH_KNOWN_HOSTS }}
          WSS_PROBE_MINT_KEY: ${{ secrets.JEEB_STAGING_WSS_PROBE_MINT_KEY }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${SSH_HOST:?JEEB_STAGING_SSH_HOST is required}"
          : "${SSH_USER:?JEEB_STAGING_DEPLOY_USER is required}"
          : "${SSH_PRIVATE_KEY:?JEEB_STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?JEEB_STAGING_SSH_KNOWN_HOSTS is required}"
          : "${WSS_PROBE_MINT_KEY:?JEEB_STAGING_WSS_PROBE_MINT_KEY is required}"
          [ "${#CLOUDFLARE_API_TOKEN}" -ge 20 ]
          [ "$(printf '%s' "$WSS_PROBE_MINT_KEY" | wc -c)" -ge 32 ]

      - name: Install pinned cloudflared and configure strict SSH
        env:
          SSH_HOST: ${{ secrets.JEEB_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_STAGING_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          package=$RUNNER_TEMP/cloudflared-linux-amd64.deb
          curl -fsSL --retry 3 -o "$package" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64.deb
          printf '%s  %s\n' \
            c805c7c8102190c04dfc16e3b4cc4acc9007d5b19b3afbcd608ea6fed7645a43 \
            "$package" | sha256sum --check --status
          sudo dpkg -i "$package"

          install -d -m 700 "$HOME/.ssh"
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          else
            printf '%s' "$SSH_PRIVATE_KEY" \
              | base64 --decode > "$HOME/.ssh/id_ed25519"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo '::error::Known-hosts secret does not pin the staging SSH host.'
            exit 1
          }
          {
            printf '%s\n' 'Host jeeb-staging'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '%s\n' \
              '  IdentityFile ~/.ssh/id_ed25519' \
              '  ProxyCommand cloudflared access ssh --hostname %h' \
              '  UserKnownHostsFile ~/.ssh/known_hosts' \
              '  StrictHostKeyChecking yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Assert exact host and healthy incumbent edge
        run: |
          set -euo pipefail
          expected_rollout_sha=$(sha256sum \
            deploy/staging/scripts/edge-origin-rollout.sh | awk '{ print $1 }')
          ssh jeeb-staging bash -s -- \
            "$expected_rollout_sha" "$ORIGIN_ROLLOUT_HELPER" <<'REMOTE'
          set -euo pipefail
          expected_rollout_sha=$1
          rollout_helper=$2
          [ "$(hostname -s)" = olivium-ephemerals ]
          ip -4 -o addr show scope global \
            | awk '{ split($4, address, "/"); print address[1] }' \
            | grep -Fxq 192.168.2.20
          test -f /etc/nginx/sites-available/jeeb-direct-tls.conf
          test -f "$rollout_helper"
          test ! -L "$rollout_helper"
          [ "$(stat -c '%U:%G:%a' "$rollout_helper")" = root:root:755 ]
          [ "$(sha256sum "$rollout_helper" | awk '{ print $1 }')" \
            = "$expected_rollout_sha" ]
          sudo -n /usr/sbin/nginx -T >/dev/null
          sudo -n /usr/sbin/nginx -t
          sudo -n /usr/bin/systemctl is-active --quiet nginx
          sudo -n /usr/bin/systemctl is-active --quiet cloudflared-jeeb-staging
          curl -fsS --max-time 5 \
            http://127.0.0.1:10000/health/ready >/dev/null
          REMOTE

      - name: Capture exact incumbent Worker and domain associations
        id: worker-incumbent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          status_file=$RUNNER_TEMP/worker-status.json
          npx --yes "wrangler@$WRANGLER_VERSION" deployments status --json \
            --config "$WRANGLER_CONFIG" > "$status_file"
          incumbent=$(jq -er '
            (if type == "array" then .[0] else . end) as $deployment
            | ($deployment.versions
                // $deployment.deployment.versions
                // $deployment.result.versions
                // empty)
            | map(select((.percentage // 100) == 100))
            | select(length == 1)
            | (.[0].version_id // .[0].id)
          ' "$status_file")
          [[ "$incumbent" =~ ^[0-9a-f-]{32,64}$ ]]
          printf 'version=%s\n' "$incumbent" >> "$GITHUB_OUTPUT"

          domain_response=$RUNNER_TEMP/incumbent-worker-domains-response.json
          domain_snapshot=$RUNNER_TEMP/incumbent-worker-domains.json
          curl -fsS --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -G "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            --data-urlencode "service=$WORKER_NAME" \
            --data-urlencode 'zone_name=fds-1.com' \
            -o "$domain_response"
          jq -e '
            .success == true
            and (.result | length == 2)
            and ([.result[].hostname] | sort
              == ["app.jeeb.fds-1.com", "cms.jeeb.fds-1.com"])
            and all(.result[]; .service == "jeeb-staging-host-router")
            and all(.result[]; .zone_name == "fds-1.com")
            and all(.result[]; (.id | type == "string" and length > 0))
            and all(.result[]; (.cert_id | type == "string" and length > 0))
          ' "$domain_response" >/dev/null
          jq -S '
            [.result[] | {
              id,
              hostname,
              service,
              zone_id,
              zone_name,
              environment: (.environment // "")
            }] | sort_by(.hostname)
          ' "$domain_response" > "$domain_snapshot"

      - name: Stage immutable origin candidates
        run: |
          set -euo pipefail
          # The validated run-scoped path expands on the runner.
          # shellcheck disable=SC2029
          ssh jeeb-staging \
            "install -d -m 700 \"\$HOME/.jeeb-edge-deploy\" \"\$HOME/$REMOTE_STAGE\""
          scp deploy/staging/nginx/jeeb-direct-tls.conf \
            jeeb-staging:"$REMOTE_STAGE/jeeb-direct-tls.conf"
          scp deploy/staging/well-known/apple-app-site-association \
            jeeb-staging:"$REMOTE_STAGE/apple-app-site-association"
          scp deploy/staging/well-known/assetlinks.json \
            jeeb-staging:"$REMOTE_STAGE/assetlinks.json"

      - name: Apply nginx and association documents atomically
        id: origin
        run: |
          set -euo pipefail
          ssh jeeb-staging sudo -n "$ORIGIN_ROLLOUT_HELPER" \
            apply "$EDGE_RUN_KEY" "$GITHUB_SHA" "$REMOTE_STAGE"

      - name: Upload and deploy the exact commit-identified Worker version
        id: worker-candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worker-upload-output.jsonl
        run: |
          set -euo pipefail
          : > "$WRANGLER_OUTPUT_FILE_PATH"
          worker_tag="git-${GITHUB_SHA:0:12}-r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          npx --yes "wrangler@$WRANGLER_VERSION" versions upload \
            --config "$WRANGLER_CONFIG" \
            --tag "$worker_tag" \
            --message "git:$GITHUB_SHA" \
            --keep-vars \
            --strict
          candidate=$(jq -s -er '
            [.[] | select(.type == "version-upload")] | last | .version_id
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          [[ "$candidate" =~ ^[0-9a-f-]{32,64}$ ]]
          printf 'version=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          npx --yes "wrangler@$WRANGLER_VERSION" versions deploy \
            "$candidate@100%" \
            --config "$WRANGLER_CONFIG" \
            --message "git:$GITHUB_SHA" \
            --yes

      - name: Prove candidate Worker is active and domains did not drift
        env:
          CANDIDATE_WORKER_VERSION: ${{ steps.worker-candidate.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_WORKER_VERSION" =~ ^[0-9a-f-]{32,64}$ ]]
          status_file=$RUNNER_TEMP/worker-candidate-active.json
          npx --yes "wrangler@$WRANGLER_VERSION" deployments status --json \
            --config "$WRANGLER_CONFIG" > "$status_file"
          active=$(jq -er '
            (if type == "array" then .[0] else . end) as $deployment
            | ($deployment.versions
                // $deployment.deployment.versions
                // $deployment.result.versions
                // empty)
            | map(select((.percentage // 100) == 100))
            | select(length == 1)
            | (.[0].version_id // .[0].id)
          ' "$status_file")
          [ "$active" = "$CANDIDATE_WORKER_VERSION" ]

          domain_response=$RUNNER_TEMP/candidate-worker-domains-response.json
          domain_snapshot=$RUNNER_TEMP/candidate-worker-domains.json
          curl -fsS --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -G "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            --data-urlencode "service=$WORKER_NAME" \
            --data-urlencode 'zone_name=fds-1.com' \
            -o "$domain_response"
          jq -e '.success == true' "$domain_response" >/dev/null
          jq -S '
            [.result[] | {
              id,
              hostname,
              service,
              zone_id,
              zone_name,
              environment: (.environment // "")
            }] | sort_by(.hostname)
          ' "$domain_response" > "$domain_snapshot"
          cmp "$RUNNER_TEMP/incumbent-worker-domains.json" "$domain_snapshot"
          printf 'worker_version=%s domain_associations=unchanged\n' "$active"

      - name: Verify public HTTPS, associations, CMS, and authorized Phoenix WSS
        id: public-verify
        env:
          JEEB_STAGING_WSS_PROBE_MINT_KEY: ${{ secrets.JEEB_STAGING_WSS_PROBE_MINT_KEY }}
        run: |
          set -euo pipefail
          response_headers=$RUNNER_TEMP/response-headers
          response_body=$RUNNER_TEMP/response-body

          poll_https_200() {
            local label=$1 url=$2 attempt result code elapsed
            for attempt in $(seq 1 30); do
              if result=$(curl -sS --proto '=https' --tlsv1.2 \
                --connect-timeout 5 --max-time 10 \
                -D "$response_headers" -o "$response_body" \
                -w '%{http_code} %{time_total}' "$url"); then
                read -r code elapsed <<< "$result"
                if [ "$code" = 200 ]; then
                  grep -Eiq '^strict-transport-security: max-age=31536000\r?$' \
                    "$response_headers"
                  printf '%s status=%s response_seconds=%s attempt=%s\n' \
                    "$label" "$code" "$elapsed" "$attempt"
                  return 0
                fi
              fi
              sleep 2
            done
            echo "::error::$label did not return HTTPS 200 within 60 seconds"
            return 1
          }

          poll_https_200 tunnel \
            https://app.jeeb.fds-1.com/__tunnel_health
          poll_https_200 gateway-readiness \
            https://app.jeeb.fds-1.com/health/ready
          poll_https_200 cms-health \
            https://cms.jeeb.fds-1.com/healthz
          grep -Eq '^healthy\r?$' "$response_body"

          verify_http_redirect() {
            local host=$1 path_and_query=$2 actual_location
            curl -sS --connect-timeout 5 --max-time 10 \
              -D "$response_headers" -o "$response_body" \
              "http://$host$path_and_query"
            grep -Eq '^HTTP/[0-9.]+ 308 ' "$response_headers"
            actual_location=$(awk '
              tolower($1) == "location:" {
                sub(/\r$/, "")
                sub(/^[^:]*:[[:space:]]*/, "")
                print
                exit
              }
            ' "$response_headers")
            [ "$actual_location" = "https://$host$path_and_query" ]
          }

          verify_public_tls_floor() {
            local host=$1 protocol output legacy_result
            for protocol in TLSv1 TLSv1.1; do
              output=$RUNNER_TEMP/tls-${host//./-}-${protocol//./-}
              legacy_result=rejected
              if printf '' | openssl s_client \
                -connect "$host:443" -servername "$host" \
                -min_protocol "$protocol" -max_protocol "$protocol" \
                -cipher 'ALL:@SECLEVEL=0' >"$output" 2>&1; then
                legacy_result=accepted
                echo "::warning title=Accepted staging TLS risk::$host accepted $protocol; hostname-scoped enforcement requires Cloudflare Advanced Certificate Manager, which is not enabled for this staging zone."
              fi
              printf 'legacy_tls host=%s requested_protocol=%s result=%s policy=advisory reason=cloudflare-free-no-advanced-certificate-manager\n' \
                "$host" "$protocol" "$legacy_result"
            done

            output=$RUNNER_TEMP/tls-${host//./-}-TLSv1-2
            printf '' | openssl s_client \
              -connect "$host:443" -servername "$host" \
              -min_protocol TLSv1.2 -max_protocol TLSv1.2 \
              >"$output" 2>&1 || {
                echo "::error::Public TLS 1.2 was not accepted by $host"
                return 1
              }
            grep -Eq '^ *Protocol *: TLSv1\.2$|^New, TLSv1\.2,' "$output"
            printf 'required_tls host=%s protocol=TLSv1.2 result=accepted policy=hard\n' \
              "$host"
          }

          verify_http_redirect app.jeeb.fds-1.com /edge-redirect-probe?source=release
          verify_http_redirect cms.jeeb.fds-1.com /edge-redirect-probe?source=release
          verify_public_tls_floor app.jeeb.fds-1.com
          verify_public_tls_floor cms.jeeb.fds-1.com

          for document in apple-app-site-association assetlinks.json; do
            curl -fsS --compressed --proto '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 10 \
              -D "$response_headers" \
              -o "$response_body" \
              "https://app.jeeb.fds-1.com/.well-known/$document"
            grep -Eq '^HTTP/[0-9.]+ 200 ' "$response_headers"
            grep -Eiq '^content-type: application/json([; ]|\r?$)' \
              "$response_headers"
            grep -Eiq '^strict-transport-security: max-age=31536000\r?$' \
              "$response_headers"
            cmp "deploy/staging/well-known/$document" "$response_body"
          done

          websocket_key=$(printf '%s' 'jeeb-edge-probe!' | base64 -w 0)
          curl -sS --http1.1 --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 10 \
            -D "$response_headers" -o "$response_body" \
            -H 'Connection: Upgrade' \
            -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' \
            -H "Sec-WebSocket-Key: $websocket_key" \
            'https://app.jeeb.fds-1.com/socket/websocket?vsn=2.0.0'
          wss_status=$(awk '/^HTTP\// { code=$2 } END { print code }' \
            "$response_headers")
          case "$wss_status" in 401|403) ;; *) exit 41 ;; esac
          if ! grep -Eiq '^x-jeeb-realtime-proxy: gateway\r?$' \
            "$response_headers"; then
            echo '::error::Unauthenticated WSS near miss did not traverse the gateway-owned proxy.'
            exit 42
          fi
          printf 'unauthenticated_wss status=%s route=gateway-to-phoenix\n' \
            "$wss_status"

          node deploy/staging/scripts/verify-authorized-wss.mjs

      - name: Verify active edge again and finalize origin state
        env:
          CANDIDATE_WORKER_VERSION: ${{ steps.worker-candidate.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INCUMBENT_WORKER_VERSION: ${{ steps.worker-incumbent.outputs.version }}
        run: |
          set -euo pipefail
          status_file=$RUNNER_TEMP/worker-final.json
          npx --yes "wrangler@$WRANGLER_VERSION" deployments status --json \
            --config "$WRANGLER_CONFIG" > "$status_file"
          active=$(jq -er '
            (if type == "array" then .[0] else . end) as $deployment
            | ($deployment.versions
                // $deployment.deployment.versions
                // $deployment.result.versions
                // empty)
            | map(select((.percentage // 100) == 100))
            | select(length == 1)
            | (.[0].version_id // .[0].id)
          ' "$status_file")
          [ "$active" = "$CANDIDATE_WORKER_VERSION" ]

          domain_response=$RUNNER_TEMP/final-worker-domains-response.json
          domain_snapshot=$RUNNER_TEMP/final-worker-domains.json
          curl -fsS --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -G "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            --data-urlencode "service=$WORKER_NAME" \
            --data-urlencode 'zone_name=fds-1.com' \
            -o "$domain_response"
          jq -e '.success == true' "$domain_response" >/dev/null
          jq -S '
            [.result[] | {
              id,
              hostname,
              service,
              zone_id,
              zone_name,
              environment: (.environment // "")
            }] | sort_by(.hostname)
          ' "$domain_response" > "$domain_snapshot"
          cmp "$RUNNER_TEMP/incumbent-worker-domains.json" "$domain_snapshot"

          ssh jeeb-staging sudo -n "$ORIGIN_ROLLOUT_HELPER" \
            finalize "$EDGE_RUN_KEY" "$GITHUB_SHA" "$REMOTE_STAGE"
          {
            printf '### Jeeb staging edge deployment\n\n'
            printf -- "- Git commit: \`%s\`\n" "$GITHUB_SHA"
            printf -- "- Worker version: \`%s\`\n" "$active"
            printf -- "- Previous Worker version: \`%s\`\n" \
              "$INCUMBENT_WORKER_VERSION"
            printf -- '- Worker domains: exact incumbent associations retained\n'
            printf -- '- nginx and association origin state: verified\n'
            printf -- '- public gateway/CMS/WSS gate: verified\n'
            printf -- '- TLS 1.2 acceptance: verified; TLS 1.0/1.1 observations: staging-only accepted-risk advisory\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean exact remote candidate directory
        run: |
          set -euo pipefail
          ssh jeeb-staging bash -s -- "$REMOTE_STAGE" <<'REMOTE'
          set -euo pipefail
          candidate=$1
          [[ "$candidate" =~ ^\.jeeb-edge-deploy/([0-9]+)_([0-9]+)$ ]]
          root_path=$HOME/.jeeb-edge-deploy
          [ -d "$root_path" ]
          [ ! -L "$root_path" ]
          root=$(realpath -e -- "$root_path")
          target=$(realpath -e -- "$HOME/$candidate")
          [ "$(dirname -- "$target")" = "$root" ]
          [[ "$(basename -- "$target")" =~ ^[0-9]+_[0-9]+$ ]]
          [ ! -L "$target" ]
          rm -rf --one-file-system -- "$target"
          [ ! -e "$target" ]
          [ ! -L "$target" ]
          REMOTE
