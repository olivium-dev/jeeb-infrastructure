# Minimal Grafana config — overrides only what we need.
# Everything else falls back to the official image defaults.

[server]
http_port = 3000
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
# Bootstrap admin via env (GF_SECURITY_ADMIN_PASSWORD) — never hard-code here.
disable_initial_admin_creation = false
allow_embedding = false

[users]
allow_sign_up = false
default_theme = dark

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info
