name: Deploy Fleet Service (Jeeb)
# Replicates the olivium fleet deploy pattern (deploy-to-salehly.yml) for the Jeeb host:
# ensure host DB -> firebase file -> env-file (Username=postgres) -> docker service rm+create (mode=host) -> verify.
# Pulls the existing ghcr image (built by the shared service repo) and deploys it to the Jeeb Swarm.
on:
  push: { branches: [feat/services] }
  workflow_dispatch:
    inputs:
      service_name:  { required: true, type: string, default: user-management }
      image_tag:     { required: true, type: string, default: '21732109434' }
      internal_port: { required: true, type: string, default: '8080' }
      external_port: { required: true, type: string, default: '10001' }
      database_name: { required: true, type: string, default: jeeb-user-management }
      needs_firebase:{ required: false, type: string, default: 'true' }
      firebase_file: { required: false, type: string, default: 'firebase-admin.json' }
permissions: { contents: read, packages: read }
env:
  SVC: user-management
  TAG: '21732109434'
  INT: '8080'
  EXT: '10001'
  DBN: jeeb-user-management
  FBF: firebase-admin.json
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Cloudflare SSH
        uses: ./.github/actions/cloudflare-ssh
        with:
          ssh-host: ${{ secrets.JEEB_SSH_HOST }}
          ssh-user: ${{ secrets.JEEB_DEPLOY_USER || 'ec2-user' }}
          ssh-private-key: ${{ secrets.JEEB_SSH_PRIVATE_KEY }}
      - name: Ensure database exists (host postgres via container)
        env: { PG_PW: "${{ secrets.JEEB_PG_PASSWORD }}" }
        run: |
          C=$(ssh jeeb-vps "docker ps -qf name=jeeb-postgres | head -1")
          ssh jeeb-vps "docker exec $C psql -U postgres -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='${DBN}'\" | grep -q 1 || docker exec $C psql -U postgres -d postgres -c 'CREATE DATABASE \"${DBN}\"'" && echo "db ok: ${DBN}"
      - name: Write Firebase file on host
        env: { FB: "${{ secrets.JEEB_FIREBASE_JSON }}" }
        run: |
          ssh jeeb-vps "printf '%s' '$FB' | base64 -d > ~/${FBF} && chmod 644 ~/${FBF} && test -s ~/${FBF} && echo firebase-ok"
      - name: Deploy (rm + create, fleet pattern)
        env:
          PG_PW: "${{ secrets.JEEB_PG_PASSWORD }}"
          JWT:   "${{ secrets.JEEB_JWT_SIGNING_KEY }}"
          GHToken: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          IMG="ghcr.io/olivium-dev/${SVC}:${TAG}"
          ssh jeeb-vps "printf '%s' '$GHToken' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh jeeb-vps "docker pull $IMG"
          # build env file on host (Username=postgres, overlay DNS host=jeeb-postgres; SKIP_DB_INIT like the fleet; shared JWT for super-login)
          ssh jeeb-vps "cat > ~/${SVC}.env <<EOF
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_HTTP_PORTS=${INT}
          ConnectionStrings__DefaultConnection=Host=jeeb-postgres;Port=5432;Database=${DBN};Username=postgres;Password=${PG_PW};Trust Server Certificate=true
          FIREBASE_CONFIG_PATH=/firebase-admin.json
          SKIP_DB_INIT=true
          Jwt__Key=${JWT}
          Jwt__Issuer=user-management
          EOF"
          ssh jeeb-vps "docker service rm ${SVC} 2>/dev/null && sleep 4 || true"
          ssh jeeb-vps "docker service create --name ${SVC} --network jeeb-net \
            --publish published=${EXT},target=${INT},mode=host --replicas 1 \
            --env-file ~/${SVC}.env \
            --mount type=bind,source=/home/ec2-user/${FBF},target=/firebase-admin.json,readonly \
            --with-registry-auth $IMG"
      - name: Verify (converge + login probe)
        env: { PG_PW: "${{ secrets.JEEB_PG_PASSWORD }}" }
        run: |
          ok=no
          for i in $(seq 1 24); do R=$(ssh jeeb-vps "docker service ls --filter name=${SVC} --format '{{.Replicas}}'"); echo "  ${SVC}: $R"; echo "$R" | grep -qE '^1/1' && { ok=yes; break; }; sleep 5; done
          [ "$ok" = yes ] || { echo "NOT converged"; ssh jeeb-vps "docker service ps --no-trunc ${SVC} | head -5; docker service logs --tail 30 ${SVC} 2>&1 | tail -30"; exit 1; }
          echo "=== probe user-management on host:${EXT} ==="
          ssh jeeb-vps "curl -sS -m 8 -o /dev/null -w 'GET /swagger -> HTTP %{http_code}\n' http://127.0.0.1:${EXT}/swagger/index.html || true"
          ssh jeeb-vps "curl -sS -m 8 -o /dev/null -w 'POST /api/User/login -> HTTP %{http_code}\n' -X POST http://127.0.0.1:${EXT}/api/User/login -H 'Content-Type: application/json' -d '{}' || true"
          echo "✅ ${SVC} deployed (fleet pattern)"
