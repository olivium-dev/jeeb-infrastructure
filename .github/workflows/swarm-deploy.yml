name: Swarm Service Deploy

# Reusable workflow for deploying/updating Docker Swarm services on Jeeb VPS
# Called by service repos (jeeb-gateway, etc.) to perform rolling updates
#
# Usage from caller workflow:
#   jobs:
#     deploy:
#       uses: olivium-dev/jeeb-infrastructure/.github/workflows/swarm-deploy.yml@main
#       with:
#         service_name: jeeb-gateway
#         image_tag: ${{ github.run_id }}
#         environment: production
#       secrets: inherit

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Name of the Docker Swarm service'
        required: true
        type: string
      image_tag:
        description: 'GHCR image tag (typically github.run_id)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: string
      published_port:
        description: 'Host port to publish (if service needs to be created)'
        required: false
        type: string
      target_port:
        description: 'Container port to map to'
        required: false
        default: '8080'
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.service_name }}:${{ inputs.image_tag }}
    runs-on: ubuntu-22.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup Cloudflare SSH
        env:
          SSH_HOST: ${{ secrets.JEEB_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_DEPLOY_USER || 'ec2-user' }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config <<EOF
          Host jeeb-vps
              HostName $SSH_HOST
              User $SSH_USER
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ProxyCommand cloudflared access ssh --hostname %h
              ServerAliveInterval 60
              ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connectivity
        run: |
          for i in 1 2 3; do
            echo "SSH attempt $i/3..."
            if ssh jeeb-vps "echo 'SSH connection successful' && hostname" 2>&1; then
              echo "SSH connectivity verified"
              exit 0
            fi
            echo "Attempt $i failed, waiting 10s..."
            sleep 10
          done
          echo "SSH connectivity failed after 3 attempts"
          exit 1

      - name: Verify image exists in GHCR
        run: |
          echo "==> Verifying image exists in GHCR..."
          
          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          IMAGE="ghcr.io/olivium-dev/${{ inputs.service_name }}:${{ inputs.image_tag }}"
          
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "ERROR: Image $IMAGE does not exist in registry"
            echo "       Ensure the service repo has built and pushed the image"
            exit 1
          fi
          
          echo "✓ Image verified: $IMAGE"

      - name: Deploy to Swarm
        run: |
          echo "==> Deploying to Docker Swarm..."
          
          SERVICE_NAME="${{ inputs.service_name }}"
          IMAGE_TAG="${{ inputs.image_tag }}"
          FULL_IMAGE="ghcr.io/olivium-dev/${SERVICE_NAME}:${IMAGE_TAG}"
          
          ssh jeeb-vps "
            echo 'Pulling image: ${FULL_IMAGE}'
            docker pull ${FULL_IMAGE}
            
            # Check if service exists
            if docker service ls --format '{{.Name}}' | grep -q "^${SERVICE_NAME}\$"; then
              echo 'Service exists, performing rolling update...'
              docker service update \\
                --image ${FULL_IMAGE} \\
                --update-parallelism 1 \\
                --update-delay 10s \\
                --update-failure-action pause \\
                ${SERVICE_NAME}
            else
              echo 'Service does not exist!'
              echo 'Please run swarm-bootstrap-service.yml first to create the service.'
              exit 1
            fi
            
            echo ''
            echo 'Service status after update:'
            docker service ps --no-trunc ${SERVICE_NAME} | head -10
          "

      - name: Verify deployment
        run: |
          echo "==> Verifying deployment..."

          SERVICE_NAME="${{ inputs.service_name }}"
          MAX_WAIT=180
          START_TIME=$(date +%s)

          while true; do
            STATUS=$(ssh jeeb-vps "docker service inspect ${SERVICE_NAME} 2>/dev/null | python3 -c \"import sys,json; d=json.load(sys.stdin)[0]; us=d.get('UpdateStatus',{}); print(us.get('State','no-update') if us else 'no-update')\"" 2>/dev/null || echo 'unknown')

            echo "Update status: $STATUS"

            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "no-update" ]; then
              echo "✓ Service is healthy (status: $STATUS)"
              break
            elif [ "$STATUS" = "paused" ]; then
              echo "✗ Service update paused on the failed candidate"
              ssh jeeb-vps "docker service ps --no-trunc ${SERVICE_NAME} | head -20"
              exit 1
            fi

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "✗ Timeout waiting for service update"
              ssh jeeb-vps "docker service ps --no-trunc ${SERVICE_NAME} | head -20"
              exit 1
            fi

            echo "  Waiting... (${ELAPSED}s / ${MAX_WAIT}s)"
            sleep 5
          done

          REPLICAS=$(ssh jeeb-vps "docker service ls --filter name=${SERVICE_NAME} --format '{{.Replicas}}'")
          echo "Replicas: $REPLICAS"
          DESIRED_REPLICAS=$(ssh jeeb-vps "docker service inspect --format='{{.Spec.Mode.Replicated.Replicas}}' '${SERVICE_NAME}'")
          [ "$REPLICAS" = "${DESIRED_REPLICAS}/${DESIRED_REPLICAS}" ] || {
            echo "✗ Service has not converged to its exact replica count"
            exit 1
          }

          FULL_IMAGE="ghcr.io/olivium-dev/${SERVICE_NAME}:${{ inputs.image_tag }}"
          IMAGE_REPOSITORY="${FULL_IMAGE%:*}"
          EXPECTED_DIGEST_REF=$(ssh jeeb-vps "docker image inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' '${FULL_IMAGE}'" \
            | awk -v prefix="${IMAGE_REPOSITORY}@" 'index($0, prefix) == 1 { print; exit }')
          EXPECTED_IMAGE_ID=$(ssh jeeb-vps "docker image inspect --format='{{.Id}}' '${FULL_IMAGE}'")
          [ -n "$EXPECTED_DIGEST_REF" ] || { echo "✗ Could not resolve requested image digest"; exit 1; }
          [ -n "$EXPECTED_IMAGE_ID" ] || { echo "✗ Could not resolve requested image ID"; exit 1; }
          EXPECTED_SERVICE_IMAGE="${FULL_IMAGE}@${EXPECTED_DIGEST_REF##*@}"

          SERVICE_IMAGE=$(ssh jeeb-vps "docker service inspect --format='{{.Spec.TaskTemplate.ContainerSpec.Image}}' '${SERVICE_NAME}'")
          case "$SERVICE_IMAGE" in
            "$EXPECTED_SERVICE_IMAGE") ;;
            *) echo "✗ Service spec image differs from the requested immutable image"; exit 1 ;;
          esac

          CONTAINER_EVIDENCE=$(ssh jeeb-vps "docker ps --filter 'label=com.docker.swarm.service.name=${SERVICE_NAME}' --format '{{.ID}}'")
          CONTAINER_COUNT=$(printf '%s\n' "$CONTAINER_EVIDENCE" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          [ "$CONTAINER_COUNT" = "$DESIRED_REPLICAS" ] || {
            echo "✗ Running container count differs from the desired replica count"
            exit 1
          }
          while IFS= read -r container_id; do
            [ -n "$container_id" ] || continue
            task_image=$(ssh jeeb-vps "docker inspect --format='{{.Config.Image}}' '$container_id'")
            task_image_id=$(ssh jeeb-vps "docker inspect --format='{{.Image}}' '$container_id'")
            [ "$task_image" = "$EXPECTED_SERVICE_IMAGE" ] || {
              echo "✗ A running container differs from the requested immutable image"
              exit 1
            }
            [ "$task_image_id" = "$EXPECTED_IMAGE_ID" ] || {
              echo "✗ A running container differs from the requested image ID"
              exit 1
            }
          done <<< "$CONTAINER_EVIDENCE"

          echo "✓ Service and running containers use the requested immutable image"

          echo ""
          echo "Final service status:"
          ssh jeeb-vps "
            docker service ls --filter name=${SERVICE_NAME}
            docker service ps --no-trunc ${SERVICE_NAME} | head -5
          "

      - name: Health check (gateway)
        if: inputs.service_name == 'jeeb-gateway'
        run: |
          echo "==> Running health check on gateway..."
          
          HEALTH_URL="${{ vars.PRODUCTION_URL }}/health/live"
          MAX_RETRIES=20
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "  Health check attempt $i/$MAX_RETRIES..."
            
            if curl -sf --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "✓ Health check passed"
              exit 0
            fi
            
            echo "  Not ready, waiting 5s..."
            sleep 5
          done
          
          echo "✗ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Record deployment
        run: |
          echo "==> Recording deployment..."
          
          ssh jeeb-vps "
            echo '\$(date -u +%FT%TZ)    ${{ inputs.service_name }}    ${{ inputs.image_tag }}    ${{ github.actor }}' >> /home/ec2-user/server-jeeb-config/.deploy-history
            echo 'Deployment recorded'
            tail -5 /home/ec2-user/server-jeeb-config/.deploy-history 2>/dev/null || echo '(new deploy history file)'
          "

      - name: Output deployment info
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════════════════╗"
          echo "║  Deployment Complete                                                       ║"
          echo "╚════════════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Service:        ${{ inputs.service_name }}"
          echo "Image tag:      ${{ inputs.image_tag }}"
          echo "Failure mode:   pause and fix forward"
