name: credential-validation-only

"on":
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Protected default-branch commit attested by the controller
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: credential-validation-only-cloudflare-staging
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.full_name == 'olivium-dev/jeeb-infrastructure' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch &&
      github.ref_protected == true
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Reject every non-canonical source before Environment entry
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          set +x
          [ "$GITHUB_REPOSITORY" = olivium-dev/jeeb-infrastructure ]
          [ "$GITHUB_REF" = refs/heads/main ]
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" = "$EXPECTED_COMMIT_SHA" ]

  validate:
    needs: preflight
    runs-on: ubuntu-22.04
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Require exact staging token-identity pin
        shell: bash
        env:
          EXPECTED_CLOUDFLARE_TOKEN_ID_SHA256: ${{ vars.JEEB_CLOUDFLARE_TOKEN_ID_SHA256 }}
        run: |
          set -euo pipefail
          set +x
          [[ "$EXPECTED_CLOUDFLARE_TOKEN_ID_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed before credential access
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [ "$GITHUB_REPOSITORY" = olivium-dev/jeeb-infrastructure ]
          [ "$GITHUB_REF" = refs/heads/main ]
          [ "$GITHUB_SHA" = "$(git rev-parse HEAD)" ]
      - name: Prove fixed-output rejection with a synthetic canary
        shell: bash
        run: |
          python3 scripts/validate_cloudflare_credential_only.py --self-test
          python3 scripts/test_credential_validation_only.py
      - name: Authenticate and verify exact zone without mutation
        shell: bash
        env:
          JEEB_STAGING_JEEB_INFRASTRUCTURE_CLOUDFLARE_API_TOKEN: ${{ secrets.JEEB_STAGING_JEEB_INFRASTRUCTURE_CLOUDFLARE_API_TOKEN }}
          EXPECTED_CLOUDFLARE_TOKEN_ID_SHA256: ${{ vars.JEEB_CLOUDFLARE_TOKEN_ID_SHA256 }}
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$JEEB_STAGING_JEEB_INFRASTRUCTURE_CLOUDFLARE_API_TOKEN" |
            env -u JEEB_STAGING_JEEB_INFRASTRUCTURE_CLOUDFLARE_API_TOKEN HTTPS_PROXY= HTTP_PROXY= ALL_PROXY= NO_PROXY='*' \
              python3 scripts/validate_cloudflare_credential_only.py --credential-fd 0
