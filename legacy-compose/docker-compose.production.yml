# jeeb-infrastructure — production overrides
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Notes:
#   - Image is pulled from REGISTRY (no local build).
#   - Traefik terminates TLS via Let's Encrypt (HTTP-01 challenge on :80/:443).
#   - MinIO provides S3-compatible object storage. For production S3 (AWS/DO Spaces)
#     leave MinIO disabled by setting `MINIO_ENABLED=0` and supply S3_* in the env.
#   - All services restart `always` (vs. `unless-stopped` in staging) so a host
#     reboot recovers without manual touch.
#   - `condition: service_healthy` ensures gateway only starts after Postgres/Redis
#     are accepting traffic, which is required for zero-downtime updates.

services:
  traefik:
    image: traefik:v3.1
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL is required for Let's Encrypt}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.level=INFO"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-acme:/letsencrypt"
      - "traefik-logs:/var/log/traefik"
    networks:
      - jeeb-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jeeb-gateway:
    build: !reset null
    image: "${REGISTRY}/jeeb-gateway:${IMAGE_TAG:?IMAGE_TAG is required in production}"
    restart: always
    # Production never exposes the gateway port directly to the host —
    # Traefik fronts it via the jeeb-net overlay.
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=jeeb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: "redis:6379"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Firebase__ProjectId: "${FIREBASE_PROJECT_ID}"
      Firebase__CredentialsPath: "/run/secrets/firebase-sa.json"
      Storage__Provider: "${STORAGE_PROVIDER:-s3}"
      Storage__Endpoint: "${S3_ENDPOINT:?S3_ENDPOINT is required (e.g. https://s3.amazonaws.com or http://minio:9000)}"
      Storage__Bucket: "${S3_BUCKET:?S3_BUCKET is required}"
      Storage__AccessKey: "${S3_ACCESS_KEY}"
      Storage__SecretKey: "${S3_SECRET_KEY}"
      Storage__Region: "${S3_REGION:-us-east-1}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${GATEWAY_DOMAIN:?GATEWAY_DOMAIN is required}`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls=true"
      - "traefik.http.routers.gateway.tls.certresolver=le"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
      - "traefik.http.services.gateway.loadbalancer.healthcheck.path=/health/live"
      - "traefik.http.services.gateway.loadbalancer.healthcheck.interval=10s"
    volumes:
      - "${FIREBASE_SA_HOST_PATH:?FIREBASE_SA_HOST_PATH is required}:/run/secrets/firebase-sa.json:ro"
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 15s
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  postgres:
    restart: always
    # Production never exposes Postgres to the host. Access is via Traefik-fronted
    # admin tools or a bastion + SSH tunnel.
    ports: !reset []
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_min_duration_statement=500"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    restart: always
    ports: !reset []
    command:
      - "redis-server"
      - "--save"
      - "300"
      - "10"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--loglevel"
      - "notice"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # In-cluster S3-compatible storage. For production deployments that use a
  # managed object store (AWS S3, DigitalOcean Spaces, Cloudflare R2) skip this
  # service via `docker compose --profile minio-managed`. Default profile keeps it on.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      MINIO_BROWSER_REDIRECT_URL: "https://${MINIO_CONSOLE_DOMAIN:-minio.${GATEWAY_DOMAIN}}"
    volumes:
      - "minio-data:/data"
    networks:
      - jeeb-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`${MINIO_API_DOMAIN:-s3.${GATEWAY_DOMAIN}}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls=true"
      - "traefik.http.routers.minio-api.tls.certresolver=le"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`${MINIO_CONSOLE_DOMAIN:-minio.${GATEWAY_DOMAIN}}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.tls.certresolver=le"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  traefik-acme:
  traefik-logs:
  minio-data:
