name: Seal existing staging Cloudflare token for organization migration

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed protected main revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: existing-staging-cloudflare-migration
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Enforce owner, protected main and exact reviewed revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]
          [ "$GITHUB_REPOSITORY" = olivium-dev/jeeb-infrastructure ]
          [ "$GITHUB_ACTOR" = oudaykhaled ]
          [ "$GITHUB_REF" = refs/heads/main ]
          [ "$GITHUB_REF_PROTECTED" = true ]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" = "$EXPECTED_SHA" ]
  seal:
    needs: guard
    environment: staging
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install sealed box support before credential access
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyNaCl==1.5.0'
      - name: Test encryption and failure boundaries
        run: python3 -m unittest discover -s scripts/tests -p test_existing_cloudflare_seal.py -v
      - name: Authenticate incumbent source and seal to fixed GitHub organization key
        env:
          SOURCE_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/seal_existing_cloudflare_secret.py
      - name: Retain GitHub-decryptable ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-github-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-github-sealed.json
          if-no-files-found: error
          retention-days: 1
