name: Deploy Datastores
on:
  push: { branches: [feat/datastores] }
  workflow_dispatch:
jobs:
  datastores:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Cloudflare SSH
        uses: ./.github/actions/cloudflare-ssh
        with:
          ssh-host: ${{ secrets.JEEB_SSH_HOST }}
          ssh-user: ${{ secrets.JEEB_DEPLOY_USER || 'ec2-user' }}
          ssh-private-key: ${{ secrets.JEEB_SSH_PRIVATE_KEY }}
      - name: Network + Postgres + Redis (detached, idempotent)
        env: { PG_PW: "${{ secrets.JEEB_PG_PASSWORD }}" }
        run: |
          ssh jeeb-vps "docker network create --driver overlay --attachable jeeb-net 2>/dev/null && echo net-created || echo net-exists"
          ssh jeeb-vps "docker service ls --format '{{.Name}}' | grep -qx jeeb-postgres || docker service create --detach --name jeeb-postgres --network jeeb-net \
            --env POSTGRES_USER=jeeb --env POSTGRES_PASSWORD='$PG_PW' --env POSTGRES_DB=postgres \
            --mount type=volume,source=jeeb-pgdata,target=/var/lib/postgresql/data --replicas 1 postgis/postgis:16-3.4"
          ssh jeeb-vps "docker service ls --format '{{.Name}}' | grep -qx jeeb-redis || docker service create --detach --name jeeb-redis --network jeeb-net \
            --mount type=volume,source=jeeb-redisdata,target=/data --replicas 1 redis:7-alpine"
      - name: Mongo (AVX-aware, detached, clean redeploy)
        env: { MONGO_PW: "${{ secrets.JEEB_MONGO_PASSWORD }}" }
        run: |
          ssh jeeb-vps "docker service rm jeeb-mongo 2>/dev/null && sleep 3 || true"
          AVX=$(ssh jeeb-vps "grep -m1 -oc avx /proc/cpuinfo 2>/dev/null || echo 0")
          if echo "$AVX" | grep -qE '^[1-9]'; then IMG=mongo:7; else IMG=mongo:4.4; fi
          echo "AVX support=$AVX -> using $IMG"
          ssh jeeb-vps "docker service create --detach --name jeeb-mongo --network jeeb-net \
            --env MONGO_INITDB_ROOT_USERNAME=jeeb --env MONGO_INITDB_ROOT_PASSWORD='$MONGO_PW' \
            --mount type=volume,source=jeeb-mongodata2,target=/data/db --replicas 1 $IMG"
      - name: Converge check (bounded, non-blocking)
        run: |
          for svc in jeeb-postgres jeeb-redis jeeb-mongo; do
            ok=no
            for i in $(seq 1 24); do
              R=$(ssh jeeb-vps "docker service ls --filter name=$svc --format '{{.Replicas}}'" 2>/dev/null)
              echo "  $svc: $R"
              echo "$R" | grep -qE '^1/1' && { ok=yes; break; }
              sleep 5
            done
            [ "$ok" = yes ] && echo "  ✓ $svc converged" || { echo "  ✗ $svc NOT converged"; ssh jeeb-vps "docker service ps --no-trunc $svc | head -4" || true; }
          done
      - name: Create per-service databases
        run: |
          C=$(ssh jeeb-vps "docker ps -qf name=jeeb-postgres | head -1")
          echo "postgres container: $C"
          for i in $(seq 1 24); do ssh jeeb-vps "docker exec $C pg_isready -U jeeb -d postgres" >/dev/null 2>&1 && break; sleep 5; done
          for db in jeeb-user-management jeeb-otpdb jeeb-wallet jeeb-location jeeb-matching delivery scoring jeeb-push-notifications; do
            if ssh jeeb-vps "docker exec $C psql -U jeeb -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='$db'\"" 2>/dev/null | grep -q 1; then
              echo "  exists: $db"
            else
              ssh jeeb-vps "docker exec $C psql -U jeeb -d postgres -c 'CREATE DATABASE \"$db\"'" && echo "  created: $db" || echo "  FAILED: $db"
            fi
          done
          ssh jeeb-vps "docker exec $C psql -U jeeb -d jeeb-matching -c 'CREATE EXTENSION IF NOT EXISTS postgis;'" && echo "  postgis on jeeb-matching"
      - name: Validate
        run: |
          echo "=== services ==="; ssh jeeb-vps "docker service ls --format '{{.Name}}|{{.Replicas}}' | grep -E 'jeeb-postgres|jeeb-redis|jeeb-mongo'"
          C=$(ssh jeeb-vps "docker ps -qf name=jeeb-postgres | head -1")
          echo "=== databases ==="; ssh jeeb-vps "docker exec $C psql -U jeeb -d postgres -tAc 'SELECT datname FROM pg_database ORDER BY 1'"
