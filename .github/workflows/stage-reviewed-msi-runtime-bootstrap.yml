name: Stage reviewed MSI runtime bootstrap

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed protected main revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage-reviewed-msi-runtime-bootstrap
  cancel-in-progress: false

jobs:
  stage:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'olivium-dev/jeeb-infrastructure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PACKAGE: deploy/msi/transport/jeeb-msi-runtime-activation-bootstrap-v7.tar
      PACKAGE_SHA256: ced9d9a5f559e8e91864479cfc432715f577096f8a2b765de180f0d26d1a003d
      REMOTE_PACKAGE: /home/msi-access/.jeeb-deploy/jeeb-msi-runtime-activation-bootstrap-v7-ced9d9a5.tar
      MSI_SSH_HOST: ssh-msi.olivium.space
      MSI_SSH_USER: msi-access
      CLOUDFLARED_VERSION: 2026.8.2
      CLOUDFLARED_SHA256: fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2
    steps:
      - name: Require owner and exact protected main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTOR" = oudaykhaled ]
          [ "$GITHUB_TRIGGERING_ACTOR" = oudaykhaled ]
          [ "$GITHUB_REF" = refs/heads/main ]
          [ "$REF_PROTECTED" = true ]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" = "$EXPECTED_SHA" ]

      - name: Check out the exact reviewed package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify package and transport tests
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PACKAGE_SHA256" "$PACKAGE" | /usr/bin/sha256sum --check --strict
          python3 -I -B -m unittest discover -s deploy/msi/transport/tests -p 'test_*.py' -v

      - name: Install pinned Cloudflare SSH client
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/cloudflared"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$path" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$path" | /usr/bin/sha256sum --check --strict
          install -d -m 0755 "$RUNNER_TEMP/bin"
          install -m 0755 "$path" "$RUNNER_TEMP/bin/cloudflared"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Configure strict password-only MSI transport
        env:
          MSI_SSH_PASSWORD: ${{ secrets.MSI_SSH_PASSWORD }}
          MSI_SSH_KNOWN_HOSTS: ${{ secrets.MSI_SSH_KNOWN_HOSTS }}
          SSH_ASKPASS: ${{ runner.temp }}/msi-askpass
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ':0'
        run: |
          set -euo pipefail
          : "${MSI_SSH_PASSWORD:?MSI_SSH_PASSWORD is required}"
          : "${MSI_SSH_KNOWN_HOSTS:?MSI_SSH_KNOWN_HOSTS is required}"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$MSI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$MSI_SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          {
            printf '%s\n' 'Host msi-bootstrap-stage'
            printf '%s\n' "  HostName $MSI_SSH_HOST" "  User $MSI_SSH_USER"
            printf '%s\n' \
              '  PreferredAuthentications password' \
              '  PubkeyAuthentication no' \
              '  KbdInteractiveAuthentication no' \
              '  StrictHostKeyChecking yes' \
              '  UserKnownHostsFile ~/.ssh/known_hosts' \
              '  ProxyCommand cloudflared access ssh --hostname %h' \
              '  ConnectTimeout 20' \
              '  ServerAliveInterval 15' \
              '  ServerAliveCountMax 2'
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"
          # shellcheck disable=SC2016
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s\n" "$MSI_SSH_PASSWORD"' > "$SSH_ASKPASS"
          chmod 0700 "$SSH_ASKPASS"

      - name: Stage exact package as msi-access without privilege
        env:
          MSI_SSH_PASSWORD: ${{ secrets.MSI_SSH_PASSWORD }}
          SSH_ASKPASS: ${{ runner.temp }}/msi-askpass
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ':0'
        run: |
          set -euo pipefail
          incoming="${REMOTE_PACKAGE}.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # shellcheck disable=SC2016
          setsid --wait ssh msi-bootstrap-stage \
            'test "$(/usr/bin/id -un)" = msi-access && test "$(/usr/bin/id -u)" = 1002 && test "$(/usr/bin/id -g)" = 1002 && test "$(/usr/bin/hostname -s)" = ouday-GT70-2OC-2OD'
          setsid --wait ssh msi-bootstrap-stage \
            "set -euo pipefail; umask 077; test ! -L /home/msi-access/.jeeb-deploy; /usr/bin/mkdir -p /home/msi-access/.jeeb-deploy; test -d /home/msi-access/.jeeb-deploy; test ! -L /home/msi-access/.jeeb-deploy; /usr/bin/chmod 0700 /home/msi-access/.jeeb-deploy; test \"\$(/usr/bin/stat -c '%u:%g:%a' /home/msi-access/.jeeb-deploy)\" = 1002:1002:700; test ! -e '$incoming'; test ! -L '$incoming'"
          cleanup() {
            setsid --wait ssh msi-bootstrap-stage \
              "test ! -e '$incoming' || /usr/bin/unlink '$incoming'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          state="$(setsid --wait ssh msi-bootstrap-stage \
            "set -euo pipefail; test -d /home/msi-access/.jeeb-deploy; test ! -L /home/msi-access/.jeeb-deploy; if test ! -e '$REMOTE_PACKAGE' && test ! -L '$REMOTE_PACKAGE'; then printf absent; else test ! -L '$REMOTE_PACKAGE'; test \"\$(/usr/bin/stat -c '%u:%g:%a:%h' '$REMOTE_PACKAGE')\" = 1002:1002:600:1; test \"\$(/usr/bin/sha256sum '$REMOTE_PACKAGE' | /usr/bin/awk '{print \$1}')\" = '$PACKAGE_SHA256'; printf exact; fi")"
          if [ "$state" = absent ]; then
            setsid --wait scp -q "$PACKAGE" "msi-bootstrap-stage:$incoming"
            setsid --wait ssh msi-bootstrap-stage \
              "set -euo pipefail; /usr/bin/chmod 0600 '$incoming'; test \"\$(/usr/bin/stat -c '%u:%g:%a:%h' '$incoming')\" = 1002:1002:600:1; test \"\$(/usr/bin/sha256sum '$incoming' | /usr/bin/awk '{print \$1}')\" = '$PACKAGE_SHA256'; /usr/bin/ln '$incoming' '$REMOTE_PACKAGE'; /usr/bin/unlink '$incoming'"
          else
            [ "$state" = exact ]
          fi
          setsid --wait ssh msi-bootstrap-stage \
            "test -d /home/msi-access/.jeeb-deploy && test ! -L /home/msi-access/.jeeb-deploy && test ! -L '$REMOTE_PACKAGE' && test \"\$(/usr/bin/stat -c '%u:%g:%a:%h' '$REMOTE_PACKAGE')\" = 1002:1002:600:1 && test \"\$(/usr/bin/sha256sum '$REMOTE_PACKAGE' | /usr/bin/awk '{print \$1}')\" = '$PACKAGE_SHA256'"
          trap - EXIT

      - name: Publish non-secret stage receipt
        run: |
          {
            printf '%s\n' '## MSI root bootstrap staged'
            printf '%s\n' ''
            printf '%s\n' "- Path: \`$REMOTE_PACKAGE\`"
            printf '%s\n' "- SHA-256: \`$PACKAGE_SHA256\`"
            # shellcheck disable=SC2016
            printf '%s\n' '- Owner/mode: `msi-access:msi-access 0600`'
            printf '%s\n' '- Privileged commands: none'
            printf '%s\n' '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner SSH material
        if: always()
        run: |
          set -euo pipefail
          test ! -e "$HOME/.ssh/config" || unlink "$HOME/.ssh/config"
          test ! -e "$HOME/.ssh/known_hosts" || unlink "$HOME/.ssh/known_hosts"
          test ! -e "$RUNNER_TEMP/msi-askpass" || unlink "$RUNNER_TEMP/msi-askpass"
