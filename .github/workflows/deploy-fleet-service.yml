name: Deploy Fleet Service (Jeeb)
# Fleet-pattern deploy (mirrors deploy-to-salehly.yml) for any Jeeb backend service:
# ensure DB -> firebase file -> env-file -> docker service rm+create (mode=host) -> verify.
on:
  workflow_dispatch:
    inputs:
      service_name:  { required: true, type: string }
      image_tag:     { required: true, type: string }
      internal_port: { required: true, type: string }
      external_port: { required: true, type: string }
      database_name: { required: false, type: string, default: '' }
      db_conn:       { required: true, type: choice, options: [dotnet, url, mongo, none] }
      needs_firebase: { required: false, type: boolean, default: false }
      needs_jwt:     { required: false, type: boolean, default: false }
      extra_env:     { required: false, type: string, default: '' }
permissions: { contents: read, packages: read }
concurrency: { group: 'deploy-${{ inputs.service_name }}', cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Cloudflare SSH
        uses: ./.github/actions/cloudflare-ssh
        with:
          ssh-host: ${{ secrets.JEEB_SSH_HOST }}
          ssh-user: ${{ secrets.JEEB_DEPLOY_USER || 'ec2-user' }}
          ssh-private-key: ${{ secrets.JEEB_SSH_PRIVATE_KEY }}
      - name: Ensure database
        env: { PG_PW: "${{ secrets.JEEB_PG_PASSWORD }}", MONGO_PW: "${{ secrets.JEEB_MONGO_PASSWORD }}" }
        run: |
          DBN='${{ inputs.database_name }}'; CONN='${{ inputs.db_conn }}'
          [ -z "$DBN" ] && { echo "no db needed"; exit 0; }
          if [ "$CONN" = "mongo" ]; then
            ssh jeeb-vps "docker exec \$(docker ps -qf name=jeeb-mongo|head -1) mongosh -u jeeb -p '$MONGO_PW' --authenticationDatabase admin --quiet --eval \"db.getSiblingDB('$DBN').createCollection('init')\" 2>/dev/null || echo mongo-db-lazy" && echo "mongo db: $DBN"
          else
            C=$(ssh jeeb-vps "docker ps -qf name=jeeb-postgres | head -1")
            ssh jeeb-vps "docker exec $C psql -U postgres -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='$DBN'\" | grep -q 1 || docker exec $C psql -U postgres -d postgres -c 'CREATE DATABASE \"$DBN\"'" && echo "pg db: $DBN"
          fi
      - name: Write Firebase file
        if: ${{ inputs.needs_firebase }}
        env: { FB: "${{ secrets.JEEB_FIREBASE_JSON }}" }
        run: ssh jeeb-vps "printf '%s' '$FB' | base64 -d > ~/firebase-admin.json && chmod 644 ~/firebase-admin.json && test -s ~/firebase-admin.json && echo firebase-ok"
      - name: Deploy (rm + create)
        env:
          PG_PW: "${{ secrets.JEEB_PG_PASSWORD }}"
          MONGO_PW: "${{ secrets.JEEB_MONGO_PASSWORD }}"
          JWT: "${{ secrets.JEEB_JWT_SIGNING_KEY }}"
          GHToken: "${{ secrets.GITHUB_TOKEN }}"
          SVC: "${{ inputs.service_name }}"
          TAG: "${{ inputs.image_tag }}"
          INT: "${{ inputs.internal_port }}"
          EXT: "${{ inputs.external_port }}"
          DBN: "${{ inputs.database_name }}"
          CONN: "${{ inputs.db_conn }}"
          FB_NEED: "${{ inputs.needs_firebase }}"
          JWT_NEED: "${{ inputs.needs_jwt }}"
          EXTRA: "${{ inputs.extra_env }}"
        run: |
          IMG="ghcr.io/olivium-dev/${SVC}:${TAG}"
          ssh jeeb-vps "printf '%s' '$GHToken' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh jeeb-vps "docker pull $IMG"
          # assemble env file on the runner, then ship it
          {
            echo "ASPNETCORE_ENVIRONMENT=Production"
            echo "ASPNETCORE_HTTP_PORTS=${INT}"
            echo "PORT=${INT}"
            echo "SKIP_DB_INIT=true"
            case "$CONN" in
              dotnet) echo "ConnectionStrings__DefaultConnection=Host=jeeb-postgres;Port=5432;Database=${DBN};Username=postgres;Password=${PG_PW};Trust Server Certificate=true";;
              url)    echo "DATABASE_URL=postgresql://postgres:${PG_PW}@jeeb-postgres:5432/${DBN}";;
              mongo)  echo "MONGODB_CONNECTION_STRING=mongodb://jeeb:${MONGO_PW}@jeeb-mongo:27017/${DBN}?authSource=admin"; echo "MONGODB_DATABASE=${DBN}";;
            esac
            [ "$JWT_NEED" = "true" ] && { echo "Jwt__Key=${JWT}"; echo "Jwt__Issuer=user-management"; echo "JwtKey=${JWT}"; echo "JwtIssuer=user-management"; }
            [ "$FB_NEED" = "true" ] && echo "FIREBASE_CONFIG_PATH=/firebase-admin.json"
            [ -n "$EXTRA" ] && printf '%s\n' "$EXTRA"
          } > /tmp/svc.env
          scp /tmp/svc.env jeeb-vps:~/${SVC}.env
          ssh jeeb-vps "docker service rm ${SVC} 2>/dev/null && sleep 4 || true"
          MOUNT=""
          [ "$FB_NEED" = "true" ] && MOUNT="--mount type=bind,source=/home/ec2-user/firebase-admin.json,target=/firebase-admin.json,readonly"
          ssh jeeb-vps "docker service create --name ${SVC} --network jeeb-net --update-failure-action pause \
            --publish published=${EXT},target=${INT},mode=host --replicas 1 \
            --env-file ~/${SVC}.env $MOUNT --with-registry-auth $IMG"
      - name: Verify
        env: { SVC: "${{ inputs.service_name }}", EXT: "${{ inputs.external_port }}" }
        run: |
          ok=no
          for i in $(seq 1 30); do R=$(ssh jeeb-vps "docker service ls --filter name=${SVC} --format '{{.Replicas}}'"); echo "  ${SVC}: $R"; echo "$R" | grep -qE '^1/1' && { ok=yes; break; }; sleep 5; done
          [ "$ok" = yes ] || { echo "::error::${SVC} not converged"; ssh jeeb-vps "docker service ps --no-trunc ${SVC}|head -5; docker service logs --tail 40 ${SVC} 2>&1|tail -40"; exit 1; }
          ssh jeeb-vps "curl -sS -m 8 -o /dev/null -w '${SVC} GET / -> HTTP %{http_code}\n' http://127.0.0.1:${EXT}/ || true"
          echo "✅ ${SVC} deployed 1/1 (fleet pattern)"
