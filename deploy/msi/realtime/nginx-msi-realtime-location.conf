# DRAFT: insert only inside the verified existing default MSI port-80 server.
# Requires ngx_http_realip_module for $realip_remote_addr; nginx -t must pass.
# No gateway proxy, TLS/auth guard, tunnel, DNS, or other route is changed here.
location = /socket/websocket {
    # Query carries a short-lived Guardian token. Never log this request URI.
    access_log off;
    error_log /dev/null crit;

    # Check the original TCP peer, not a forwarded/re-written client identity.
    if ($realip_remote_addr !~ "^(127\\.0\\.0\\.1|::1)$") { return 403; }
    if ($http_host != "msi.olivium.space") { return 404; }
    # Exact raw path too: reject normalized slash/escape/dot-segment aliases.
    if ($request_uri !~ "^/socket/websocket(?:\\?.*)?$") { return 404; }
    if ($request_method != GET) { return 405; }
    if ($http_upgrade !~* "^websocket$") { return 400; }
    if ($http_sec_websocket_version != "13") { return 400; }
    # Native clients may omit Origin. Browser clients must use this exact origin.
    if ($http_origin !~ "^(https://msi\\.olivium\\.space)?$") { return 403; }

    # This fixed location preserves the original path and query to the private
    # Phoenix endpoint. Nothing else on realtime is exposed by this fragment.
    proxy_pass http://127.0.0.1:5804;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;

    proxy_set_header Host msi.olivium.space;
    proxy_set_header Upgrade websocket;
    proxy_set_header Connection upgrade;
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
    proxy_set_header Sec-WebSocket-Version 13;
    proxy_set_header Origin $http_origin;
    proxy_set_header Content-Length "";
}
