# Jeeb staging tunnel origin with TLS terminated by nginx.
#
# The certificate is issued with DNS-01. TLS is loopback-only: cloudflared is
# the sole origin client and validates the exact app/CMS certificate names.

include /etc/nginx/jeeb-origin-key.map;

map $http_upgrade $jeeb_staging_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    server_name app.jeeb.fds-1.com;

    ssl_certificate /etc/letsencrypt/live/jeeb-staging-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeeb-staging-edge/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/jeeb-staging-edge/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jeeb_staging_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    if ($jeeb_origin_authorized = 0) {
        return 403;
    }

    location = /__tunnel_health {
        default_type text/plain;
        return 200 "jeeb staging origin ok\n";
    }

    # Platform-owned association documents are served directly from the
    # repository-managed origin. They must stay unauthenticated, redirect-free,
    # and byte-for-byte stable so Android and iOS can verify the staging app.
    location = /.well-known/apple-app-site-association {
        alias /var/www/jeeb-staging-well-known/current/apple-app-site-association;
        default_type application/json;
        # location-level add_header directives replace inherited server headers.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /.well-known/assetlinks.json {
        alias /var/www/jeeb-staging-well-known/current/assetlinks.json;
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Phoenix is the only staging backend with an explicitly approved public
    # socket route. Tokens travel in the query string, so never access-log it.
    location = /socket/websocket {
        access_log off;
        proxy_pass http://127.0.0.1:10069/socket/websocket;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Jeeb-Origin-Key "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jeeb_staging_connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Jeeb-Origin-Key "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jeeb_staging_connection_upgrade;
    }
}

server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    server_name cms.jeeb.fds-1.com;

    ssl_certificate /etc/letsencrypt/live/jeeb-staging-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeeb-staging-edge/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/jeeb-staging-edge/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jeeb_staging_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Evidence URLs contain opaque bearer material in the path.
    access_log off;
    client_max_body_size 25m;

    if ($jeeb_origin_authorized = 0) {
        return 403;
    }

    # Owner callbacks remain private even if the MSI configuration changes.
    location ~* ^/gateway/svc-callbacks(?:/|$) {
        return 404;
    }

    location ~* ^/gateway/v1/case-events/?$ {
        return 404;
    }

    # The CMS remains on its LAN-only MSI host. Preserve the browser-visible
    # public host so same-origin session checks survive the second nginx hop.
    location / {
        proxy_pass http://192.168.2.39:80;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Jeeb-Origin-Key "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jeeb_staging_connection_upgrade;
    }
}
