name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to commit SHA)"
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/olivium-dev
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  deploy:
    name: Deploy jeeb-gateway to staging
    runs-on: ubuntu-22.04
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          GATEWAY_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          chmod +x deploy/staging-deploy.sh
          ./deploy/staging-deploy.sh

      - name: Verify deployment
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          echo "Verifying ${STAGING_URL}/health/live"
          for i in {1..20}; do
            if curl -sf --max-time 5 "${STAGING_URL}/health/live" > /dev/null; then
              echo "Health check passed (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i}/20 — waiting 5s"
            sleep 5
          done
          echo "Health check failed after 20 attempts"
          exit 1
