name: update-ephemeral-manager-oidc-allowlist

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeeb-staging-ephemeral-manager-oidc-allowlist
  cancel-in-progress: false

env:
  OLD_SHARED_WORKFLOW_SHA: c1a1a04e0db46816b865fd8d7d979f36fd57514e
  NEW_SHARED_WORKFLOW_SHA: 3b9b67e2b4fd9846979ae3c039ec03575f41dfc8
  SHARED_WORKFLOW_REF: olivium-dev/shared-github-actions/.github/workflows/deploy-jeeb-operational.yml@refs/heads/main

jobs:
  default-branch-gate:
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse non-default-branch dispatch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = branch ]
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || {
            echo '::error::The manager allowlist may be updated only from the default branch.'
            exit 1
          }

  update:
    needs: default-branch-gate
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - name: Check out the exact default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned cloudflared and configure strict SSH
        env:
          SSH_HOST: ${{ secrets.JEEB_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_STAGING_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?JEEB_STAGING_SSH_HOST is required}"
          : "${SSH_USER:?JEEB_STAGING_DEPLOY_USER is required}"
          : "${SSH_PRIVATE_KEY:?JEEB_STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?JEEB_STAGING_SSH_KNOWN_HOSTS is required}"

          package=$RUNNER_TEMP/cloudflared-linux-amd64.deb
          curl -fsSL --retry 3 -o "$package" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64.deb
          printf '%s  %s\n' \
            c805c7c8102190c04dfc16e3b4cc4acc9007d5b19b3afbcd608ea6fed7645a43 \
            "$package" | sha256sum --check --status
          sudo dpkg -i "$package"

          install -d -m 700 "$HOME/.ssh"
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          else
            printf '%s' "$SSH_PRIVATE_KEY" \
              | base64 --decode > "$HOME/.ssh/id_ed25519"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo '::error::Known-hosts does not pin the staging SSH host.'
            exit 1
          }
          {
            printf '%s\n' 'Host jeeb-staging'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '%s\n' \
              '  IdentityFile ~/.ssh/id_ed25519' \
              '  ProxyCommand cloudflared access ssh --hostname %h' \
              '  UserKnownHostsFile ~/.ssh/known_hosts' \
              '  StrictHostKeyChecking yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Replace only the exact obsolete workflow SHA and restart once
        run: |
          set -euo pipefail
          ssh jeeb-staging bash -s -- \
            "$SHARED_WORKFLOW_REF" \
            "$OLD_SHARED_WORKFLOW_SHA" \
            "$NEW_SHARED_WORKFLOW_SHA" <<'REMOTE'
          set -euo pipefail
          workflow_ref=$1
          old_sha=$2
          new_sha=$3

          [[ "$old_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$new_sha" =~ ^[0-9a-f]{40}$ ]]
          [ "$old_sha" != "$new_sha" ]
          [ "$(hostname -s)" = olivium-ephemerals ]
          ip -4 -o addr show scope global \
            | awk '{ split($4, address, "/"); print address[1] }' \
            | grep -Fxq 192.168.2.20
          printf '%s\n' 'manager_host=verified'

          ref_line="AUTOMATION__ALLOWEDWORKFLOWS__0__REF=$workflow_ref"
          old_line="AUTOMATION__ALLOWEDWORKFLOWS__0__SHA=$old_sha"
          new_line="AUTOMATION__ALLOWEDWORKFLOWS__0__SHA=$new_sha"
          count_exact_in_file() {
            local path=$1 expected=$2 output status
            set +e
            output=$(grep -Fxc -- "$expected" "$path" 2>/dev/null)
            status=$?
            set -e
            if [ "$status" -le 1 ] && [[ "$output" =~ ^[0-9]+$ ]]; then
              printf '%s' "$output"
              return 0
            fi
            set +e
            output=$(sudo -n grep -Fxc -- "$expected" "$path" 2>/dev/null)
            status=$?
            set -e
            if [ "$status" -le 1 ] && [[ "$output" =~ ^[0-9]+$ ]]; then
              printf '%s' "$output"
              return 0
            fi
            return 2
          }

          matching_scopes=()
          matching_units=()
          matching_files=()
          for candidate_scope in system user; do
            candidate_systemctl=(systemctl)
            if [ "$candidate_scope" = user ]; then
              candidate_systemctl+=(--user)
            fi
            mapfile -t active_units < <(
              "${candidate_systemctl[@]}" list-units --type=service \
                --state=running --no-legend --plain 2>/dev/null \
                | awk '{ print $1 }' | sort -u
            )
            for candidate_unit in "${active_units[@]}"; do
              while IFS= read -r candidate_file; do
                case "$candidate_file" in
                  /etc/*ephemeral* | \
                  /opt/*ephemeral* | \
                  /home/ec2-user/*ephemeral*) ;;
                  *) continue ;;
                esac
                if candidate_ref_count=$(count_exact_in_file \
                    "$candidate_file" "$ref_line") \
                  && candidate_old_count=$(count_exact_in_file \
                    "$candidate_file" "$old_line") \
                  && [ "$candidate_ref_count" = 1 ] \
                  && [ "$candidate_old_count" = 1 ]; then
                  matching_scopes+=("$candidate_scope")
                  matching_units+=("$candidate_unit")
                  matching_files+=("$candidate_file")
                fi
              done < <(
                "${candidate_systemctl[@]}" show \
                  --property=EnvironmentFiles --value "$candidate_unit" \
                  2>/dev/null \
                  | tr ' ' '\n' | sed -n '\|^/|p' | sort -u
              )
            done
          done
          [ "${#matching_units[@]}" = 1 ] || {
            printf 'manager_config_identity_count=%s\n' "${#matching_units[@]}"
            printf '%s\n' 'manager_runtime_inventory_begin'
            systemctl list-units --type=service --state=running \
              --no-legend --plain 2>/dev/null \
              | awk '{ printf "manager_system_unit=%s\n", $1 }' \
              | sort -u
            systemctl --user list-units --type=service --state=running \
              --no-legend --plain 2>/dev/null \
              | awk '{ printf "manager_user_unit=%s\n", $1 }' \
              | sort -u || true
            if docker info >/dev/null 2>&1; then
              docker ps --format \
                'manager_container={{.Names}} image={{.Image}} ports={{.Ports}}' \
                | sort -u
            else
              printf '%s\n' 'manager_docker_access=unavailable'
            fi
            ss -H -ltnp 'sport = :8080' 2>/dev/null \
              | sed 's/^/manager_listener=/' || true
            mapfile -t runtime_pids < <(
              ps -eo pid=,user=,comm=,args= --sort=pid \
                | awk 'tolower($0) ~ /ephemeral|dotnet|8080/ { print $1 }' \
                | sort -nu
            )
            for runtime_pid in "${runtime_pids[@]}"; do
              ps -p "$runtime_pid" -o pid=,ppid=,user=,comm= \
                | awk '{ printf "manager_process=pid:%s,ppid:%s,user:%s,comm:%s\n", $1, $2, $3, $4 }'
              parent_pid=$(ps -p "$runtime_pid" -o ppid= | tr -d ' ')
              ps -p "$parent_pid" -o pid=,ppid=,user=,comm= \
                | awk '{ printf "manager_parent_process=pid:%s,ppid:%s,user:%s,comm:%s\n", $1, $2, $3, $4 }'
              while IFS= read -r process_argument; do
                case "$process_argument" in
                  *.dll | *.csproj)
                    printf 'manager_process_artifact=%s\n' "$process_argument"
                    ;;
                esac
              done < <(tr '\0' '\n' < "/proc/$runtime_pid/cmdline" 2>/dev/null || true)
              runtime_cwd=$(readlink "/proc/$runtime_pid/cwd" 2>/dev/null || true)
              printf 'manager_process_cwd=%s\n' "${runtime_cwd:-unavailable}"
            done
            printf '%s\n' 'manager_runtime_inventory_end'
            echo '::error::Exactly one active manager config identity is required.'
            exit 1
          }
          scope=${matching_scopes[0]}
          unit=${matching_units[0]}
          env_file=${matching_files[0]}
          manager_systemctl=(systemctl)
          if [ "$scope" = user ]; then
            manager_systemctl+=(--user)
          fi
          "${manager_systemctl[@]}" is-active --quiet "$unit"
          printf 'manager_unit_scope=%s\n' "$scope"
          printf 'manager_unit=%s\n' "$unit"
          printf 'manager_environment_file=%s\n' "$env_file"
          curl -fsS --max-time 5 \
            http://127.0.0.1:8080/health/ready >/dev/null
          printf '%s\n' 'manager_incumbent_health=verified'

          count_exact() {
            local expected=$1
            if ! count_exact_in_file "$env_file" "$expected"; then
              echo '::error::Unable to read the manager environment file.'
              exit 1
            fi
          }
          ref_count=$(count_exact "$ref_line")
          old_count=$(count_exact "$old_line")
          new_count=$(count_exact "$new_line")
          printf 'manager_allowlist_counts=ref:%s,old:%s,new:%s\n' \
            "$ref_count" "$old_count" "$new_count"
          [ "$ref_count" = 1 ]
          [ "$old_count" = 1 ]
          [ "$new_count" = 0 ]

          mutation_mode=
          if [ "$scope" = user ] && [ -w "$env_file" ]; then
            mutation_mode=owned-user-service
          elif [ "$scope" = system ] \
            && sudo -n true >/dev/null 2>&1; then
            mutation_mode=root-system-service
          else
            echo '::error::Config write and service restart authority are not both available.'
            exit 1
          fi
          printf 'manager_mutation_authority=%s\n' "$mutation_mode"

          if [ "$mutation_mode" = owned-user-service ]; then
            sed -i "s|^$old_line\$|$new_line|" "$env_file"
          else
            sudo -n sed -i "s|^$old_line\$|$new_line|" "$env_file"
          fi

          [ "$(count_exact "$old_line")" = 0 ]
          [ "$(count_exact "$new_line")" = 1 ]
          if [ "$mutation_mode" = owned-user-service ]; then
            "${manager_systemctl[@]}" restart "$unit"
          else
            sudo -n systemctl restart "$unit"
          fi

          for attempt in $(seq 1 30); do
            if "${manager_systemctl[@]}" is-active --quiet "$unit" \
              && curl -fsS --max-time 5 \
                http://127.0.0.1:8080/health/ready >/dev/null; then
              printf '%s\n' 'Ephemeral manager OIDC allowlist updated and healthy.'
              exit 0
            fi
            sleep 2
          done
          echo '::error::Manager did not become healthy with the new exact allowlist.'
          exit 1
          REMOTE

      - name: Verify the public manager health endpoint
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 15 \
            https://ephemeral.fds-8.space/health/ready >/dev/null
          printf '%s\n' 'Public ephemeral manager health verified.'
