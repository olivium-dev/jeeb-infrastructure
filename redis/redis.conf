# jeeb-infrastructure — Redis 7 configuration
#
# Workloads served by this instance:
#   1. Location geo-queries (GEOADD / GEOSEARCH) for Jeeber matching.
#   2. Chat + delivery-tracking pub/sub channels.
#   3. Session caching for jeeb-gateway / auth-service.
#   4. Token-bucket rate limiting for public APIs.
#
# We mix volatile cache data with durable state (geo sets, session tokens that
# back the auth flow). To avoid evicting load-bearing keys we use
# `allkeys-lru` only on keys that explicitly set a TTL — long-lived geo sets
# and pub/sub state are left untouched. See `maxmemory-policy` below.

################################## NETWORK ####################################
bind 0.0.0.0 -::*
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

################################## GENERAL ####################################
daemonize no
loglevel notice
databases 16

################################## MEMORY #####################################
# 256MB matches the staging container limit in docker-compose.staging.yml.
# Override in production via `--maxmemory` on the command line.
maxmemory 256mb

# `volatile-lru` evicts only keys with a TTL — geo sets and registered pub/sub
# state stay resident. Cache + session keys MUST set EXPIRE.
maxmemory-policy volatile-lru
maxmemory-samples 5

################################## PERSISTENCE ################################
# RDB snapshots — crash recovery for the geo dataset.
#   - after 900s if >= 1 key changed
#   - after 300s if >= 10 keys changed
#   - after  60s if >= 10000 keys changed
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF — durable replay for session + rate-limit counters between snapshots.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

################################## SLOW LOG ###################################
slowlog-log-slower-than 10000
slowlog-max-len 128

################################## ADVANCED ###################################
# Pub/Sub: keep clients with up to 32MB of pending messages before disconnect.
# Default (8mb hard) is too tight for chat fan-out during burst load.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Active key expiration — important because volatile-lru relies on TTLs.
hz 10

# Geo commands run on sorted sets — keep ziplist threshold high enough that
# small per-Jeeber position sets stay compact.
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
