apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: loki

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      ## Render `trace_id="..."` (or "trace_id":"...") in any log line as
      ## a clickable link that pivots into Sentry Performance for that
      ## trace. Falls back to a Loki search if Sentry isn't configured.
      derivedFields:
        - name: trace_id
          matcherRegex: '"?trace_id"?[:=]\s*"?([a-f0-9]{16,32})"?'
          url: '${__value.raw}'
          urlDisplayLabel: 'View trace'
          datasourceUid: loki
